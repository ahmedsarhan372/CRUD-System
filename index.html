<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD System — Product Catalog</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <section class="my-4 my-md-5">
      <div class="container panel py-4 py-md-5 px-4 px-md-5">
        <p class="panel-eyebrow">Product record</p>
        <h1 class="panel-title">CRUD SYSTEM</h1>

        <div>
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="productName" placeholder=" " />
            <label for="productName">productName</label>
          </div>

          <div class="form-floating mb-3">
            <input type="number" class="form-control" id="productPrice" placeholder=" " />
            <label for="productPrice">productPrice</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" list="cat" class="form-control" id="productCategory" placeholder=" " />
            <label for="productCategory">productCategory</label>

            <datalist id="cat">
              <option value="tv" />
              <option value="mobile" />
              <option value="screens" />
              <option value="electronic" />
            </datalist>
          </div>

          <div class="form-floating mb-3">
            <textarea class="form-control" id="productDescription" placeholder=" "></textarea>
            <label for="productDescription">productDescription</label>
          </div>

          <div class="form-floating mb-3">
            <input type="file" class="form-control" id="productImg" placeholder=" " />
            <label for="productImg">productImg</label>
          </div>

          <div class="btns">
            <button class="btn btn-sm btn-primary" id="btnAdd">Add Product</button>
            <button class="btn btn-sm btn-warning d-none" id="btnUpdate">Update Product</button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="search-wrap">
          <i class="fas fa-magnifying-glass"></i>
          <input id="search" type="search" class="form-control" placeholder="Search By Name.." />
        </div>

        <div class="row g-4" id="rowData">
          <div class="col-md-3">
            <div class="card h-100">
              <img class="card-img-top" height="200px" src="./images/1.jpg" alt="title" />
              <div class="card-body">
                <span class="badge text-white">Index:</span>
                <h4 class="card-title">ProductName:</h4>
                <p class="card-title">ProductPrice:</p>
                <p class="card-title">ProductCategory:</p>
                <p class="card-title">ProductDescription:</p>
                <p class="card-title">Date:</p>
              </div>

              <div class="card-footer text-center">
                <button class="btn btn-outline-danger btn-sm" aria-label="Delete product">
                  <i class="fas fa-trash"></i>
                </button>
                <button class="btn btn-outline-warning btn-sm" aria-label="Edit product">
                  <i class="fas fa-edit"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./js/bootstrap.bundle.min.js"></script>

    <script src="./js/main.js"></script>
  </body>
</html>
